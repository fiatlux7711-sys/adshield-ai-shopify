name: Apply production release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply release patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am adshield-production-release.patch
          git rm adshield-production-release.patch
          git commit -m "Remove applied release patch"
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:check-pg
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:generate:pg
      - run: npm run build
      - name: Push verified release
        run: git push origin HEAD:main
